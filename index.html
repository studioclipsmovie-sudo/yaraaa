<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Für Yara 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #ffe0f0, #fff0f5);
      overflow-x: hidden;
      text-align: center;
      color: #d94f8b;
    }
    h1, h2 { font-family: 'Pacifico', cursive; margin: 20px 0; }

    /* Startscreen */
    #startScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 230, 240, 0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10; transition: opacity 0.5s;
    }
    #startScreen button {
      padding: 10px 20px; font-size: 1.2rem; border: none;
      background: #ffb6c1; color: white; border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    #startScreen button:hover { transform: scale(1.1); }

    /* Countdown */
    #countdown { font-size: 2rem; margin: 30px 0; font-weight: bold; }

    /* Herzchen Animation */
    .heart {
      position: absolute; width: 20px; height: 20px; background: #ff6fa1;
      transform: rotate(-45deg); animation: floatUp linear infinite; opacity: 0.8;
    }
    .heart::before, .heart::after {
      content: ""; position: absolute; width: 20px; height: 20px; background: #ff6fa1; border-radius: 50%;
    }
    .heart::before { top: -10px; left: 0; }
    .heart::after { top: 0; left: 10px; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-45deg); opacity:0.8; }
      100% { transform: translateY(-800px) rotate(-45deg); opacity:0; }
    }

    /* Galerie - Gesichter sichtbar */
    #gallery { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 30px 0; }
    #gallery img {
      width: 200px;
      height: 150px;
      object-fit: contain;  /* Ganzes Bild sichtbar */
      background: #fff0f5; /* Pastellhintergrund für leere Stellen */
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    #gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    }

    /* Nachrichten */
    #messageBox { margin: 20px auto; padding: 15px; background: #ffe0f0; border-radius: 12px; font-size: 1.2rem; display: none; max-width: 400px; }

    /* Musikbutton */
    #musicBtn { margin: 20px; padding: 10px 20px; font-size: 1rem; border: none; border-radius: 12px; background: #ffb6c1; color: white; cursor: pointer; }

    /* Spielbereich */
    #gameContainer {
      position: relative;
      width: 100%;
      height: 300px;
      background: linear-gradient(to top, #fff0f5, #ffe0f0);
      overflow: hidden;
      border-radius: 12px;
      margin: 30px 0;
    }
    #player {
      position: absolute; bottom: 10px; left: 50%;
      width: 50px; height: 50px; margin-left: -25px;
      background: #ff6fa1; border-radius: 50%;
      cursor: pointer;
    }
    .fallingHeart {
      position: absolute;
      width: 30px; height: 30px;
      background: #ffb6c1; transform: rotate(-45deg);
    }
    .fallingHeart::before, .fallingHeart::after {
      content: ""; position: absolute; width: 30px; height: 30px; background: #ffb6c1; border-radius: 50%;
    }
    .fallingHeart::before { top: -15px; left: 0; }
    .fallingHeart::after { top: 0; left: 15px; }

    #score { font-size: 1.5rem; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Startscreen -->
  <div id="startScreen">
    <h1>Für Yara 💖</h1>
    <button onclick="startPage()">Überraschungggg!</button>
  </div>

  <!-- Countdown -->
  <h2>Countdown bis Valentinstag:</h2>
  <div id="countdown"></div>

  <!-- Galerie -->
  <h2>Wirrrr zusammen (du mogst mich) 📸</h2>
  <div id="gallery">
    <img src="bilder/IMG_2735.jpg" alt="Foto 1">
    <img src="bilder/IMG_2792.jpg" alt="Foto 2">
    <img src="bilder/IMG_2789.jpg" alt="Foto 3">
  </div>

  <!-- Nachrichten -->
  <button onclick="showMessage()"> Drück mal hierrr</button>
  <div id="messageBox">Ich liebe dich, genauso wie du bist, über alles! 💖</div>

  <!-- Musik -->
  <button id="musicBtn" onclick="toggleMusic()">🎵 Musik an/aus</button>
  <audio id="bgMusic" loop>
    <source src="musik/liebeslied.mp3" type="audio/mpeg">
  </audio>

  <!-- Herzchen Animation -->
  <div id="hearts"></div>

  <!-- Herzchen-Fang-Spiel -->
  <h2>Fange die Herzchen! 💘</h2>
  <div id="gameContainer">
    <div id="player"></div>
  </div>
  <div id="score">Punkte: 0</div>

  <script>
    // Startscreen schließen
    function startPage() {
      document.getElementById('startScreen').style.opacity = 0;
      setTimeout(() => {
        document.getElementById('startScreen').style.display = 'none';
        createHearts();
        startGame();
      }, 500);
    }

    // Countdown
    const countdownEl = document.getElementById('countdown');
    const valentinstag = new Date("Feb 14, 2026 00:00:00").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const distance = valentinstag - now;
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      countdownEl.innerHTML = `${days} Tage ${hours}h ${minutes}m ${seconds}s`;
    }
    setInterval(updateCountdown, 1000);

    // Nachrichten anzeigen
    function showMessage() {
      const box = document.getElementById('messageBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    // Musik
    const music = document.getElementById('bgMusic');
    function toggleMusic() { music.paused ? music.play() : music.pause(); }

    // Herzchen Animation
    function createHearts() {
      for(let i=0; i<30; i++){
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.animationDuration = (2 + Math.random() * 3) + 's';
        heart.style.width = heart.style.height = (10 + Math.random() * 20) + 'px';
        document.body.appendChild(heart);
      }
    }

    // ===== Herzchen-Fang-Spiel =====
    const gameContainer = document.getElementById('gameContainer');
    const player = document.getElementById('player');
    let score = 0;

    // Spielerbewegung Maus
    document.addEventListener('mousemove', e => {
      const rect = gameContainer.getBoundingClientRect();
      let x = e.clientX - rect.left - player.offsetWidth/2;
      x = Math.max(0, Math.min(rect.width - player.offsetWidth, x));
      player.style.left = x + 'px';
    });

    // Spielerbewegung für Touchscreen (NUR im Spielbereich)
gameContainer.addEventListener('touchmove', e => {
  const touch = e.touches[0];
  const rect = gameContainer.getBoundingClientRect();
  let x = touch.clientX - rect.left - player.offsetWidth/2;
  x = Math.max(0, Math.min(rect.width - player.offsetWidth, x));
  player.style.left = x + 'px';
});


    // Herzchen erzeugen
    function createFallingHeart() {
      const heart = document.createElement('div');
      heart.classList.add('fallingHeart');
      heart.style.left = Math.random() * (gameContainer.offsetWidth - 30) + 'px';
      heart.style.top = '0px';
      gameContainer.appendChild(heart);

      const fallInterval = setInterval(() => {
        let top = parseInt(heart.style.top);
        if(top + 30 >= gameContainer.offsetHeight - player.offsetHeight &&
           top + 30 <= gameContainer.offsetHeight &&
           Math.abs(parseInt(heart.style.left) - parseInt(player.style.left)) < 50){
          score++;
          document.getElementById('score').innerText = "Punkte: " + score;
          heart.remove();
          clearInterval(fallInterval);
        } else if(top >= gameContainer.offsetHeight){
          heart.remove();
          clearInterval(fallInterval);
        } else {
          heart.style.top = top + 3 + 'px';
        }
      }, 20);
    }

    function startGame() {
      setInterval(createFallingHeart, 1000);
    }
  </script>
</body>
</html>
